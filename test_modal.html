<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Modal Loading Test</h1>
        
        <!-- Test button to trigger modal -->
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#testModal">
            Test Modal
        </button>
        
        <!-- Test link like in file manager -->
        <p class="mt-3">
            <a href="#" data-bs-toggle="modal" data-bs-target="#testModal">Browse files (test link)</a>
        </p>
    </div>

    <!-- Test Modal (similar structure to upload modal) -->
    <div class="modal fade" id="testModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Test Modal</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>This is a test modal to check if Bootstrap modals are working correctly.</p>
                    <form id="testForm">
                        <div class="mb-3">
                            <label class="form-label">Test Input</label>
                            <input type="text" class="form-control" placeholder="Type something...">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary">Test Action</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Test script to debug modal issues
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded');
            console.log('Bootstrap version:', typeof bootstrap !== 'undefined' ? 'loaded' : 'not loaded');
            
            // Test modal initialization
            const testModal = document.getElementById('testModal');
            if (testModal) {
                console.log('Test modal element found');
                
                // Initialize modal manually if needed
                const modal = new bootstrap.Modal(testModal);
                
                // Add event listeners to debug modal behavior
                testModal.addEventListener('show.bs.modal', function () {
                    console.log('Modal is about to show');
                });
                
                testModal.addEventListener('shown.bs.modal', function () {
                    console.log('Modal is now visible');
                });
                
                testModal.addEventListener('hide.bs.modal', function () {
                    console.log('Modal is about to hide');
                });
                
                testModal.addEventListener('hidden.bs.modal', function () {
                    console.log('Modal is now hidden');
                });
            } else {
                console.error('Test modal element not found');
            }
            
            // Test clicking the modal trigger
            const modalTriggers = document.querySelectorAll('[data-bs-toggle="modal"]');
            console.log('Found', modalTriggers.length, 'modal triggers');
            
            modalTriggers.forEach((trigger, index) => {
                trigger.addEventListener('click', function(e) {
                    console.log('Modal trigger', index, 'clicked');
                    const target = this.getAttribute('data-bs-target');
                    console.log('Target modal:', target);
                });
            });
        });
    </script>
</body>
</html>
